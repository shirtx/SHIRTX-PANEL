<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIRTX PANEL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ดาวพื้นหลัง */
#stars{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:0;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:#fff;
  border-radius:50%;
  animation:moveStar linear infinite;
}

@keyframes moveStar{
  0%{
    transform:translateY(0);
    opacity:.2;
  }
  50%{
    opacity:1;
  }
  100%{
    transform:translateY(100vh);
    opacity:.2;
  }
}

main{
  position:relative;
  z-index:2;
  width:92%;
  max-width:430px;
  margin:0 auto;
  padding:25px 0;
}

/* โปรไฟล์ */
.profile{
  text-align:center;
  margin-bottom:20px;
}

.avatar{
  width:110px;
  height:110px;
  margin:auto;
  border-radius:50%;
  overflow:hidden;
  border:2px solid #777;
  background:#111;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  margin-top:12px;
  font-size:32px;
  letter-spacing:4px;
}

/* การ์ด */
.card{
  display:flex;
  align-items:center;
  gap:12px;
  background:#0b0b0b;
  border:1px solid #292929;
  border-radius:14px;
  padding:14px;
  margin:10px 0;
  transition:.2s;
}

.card.on{
  border-color:#777;
  box-shadow:0 0 12px rgba(255,255,255,.08);
}

.icon{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#151515;
  border-radius:10px;
  font-size:20px;
}

.info{
  flex:1;
}

.name{
  font-size:14px;
  font-weight:bold;
  text-transform:uppercase;
}

.sub{
  color:#777;
  font-size:10px;
  margin-top:4px;
}

/* Switch */
.switch{
  width:48px;
  height:26px;
  background:#252525;
  border:1px solid #444;
  border-radius:20px;
  position:relative;
  cursor:pointer;
}

.switch::after{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  top:3px;
  left:3px;
  background:#888;
  border-radius:50%;
  transition:.2s;
}

.card.on .switch{
  background:#444;
}

.card.on .switch::after{
  transform:translateX(21px);
  background:#fff;
}

/* ปุ่มเข้าเกม */
.buttons{
  margin-top:18px;
}

.start{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #555;
  background:#151515;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:.15s;
}

.start:active{
  transform:scale(.96);
}

.status{
  text-align:center;
  margin-top:15px;
  color:#999;
  font-size:11px;
  letter-spacing:1px;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#555;
  font-size:10px;
  letter-spacing:3px;
}
</style>
</head>

<body>

<div id="stars"></div>

<main>

  <div class="profile">
    <div class="avatar">
      <img src="./Messenger_creation_EE58EC70-CFDC-4C22-8D57-3C3DB93E80B7.jpeg" alt="SHIRTX profile">
    </div>

    <h1>SHIRTX</h1>
  </div>

  <div class="card" onclick="toggle(this,'Reduzir Recuo')">
    <div class="icon">🎯</div>
    <div class="info">
      <div class="name">Reduzir Recuo</div>
      <div class="sub">UI Demo</div>
    </div>
    <div class="switch"></div>
  </div>

  <div class="card" onclick="toggle(this,'Aumentar FPS')">
    <div class="icon">⚡</div>
    <div class="info">
      <div class="name">Aumentar FPS</div>
      <div class="sub">UI Demo</div>
    </div>
    <div class="switch"></div>
  </div>

  <div class="card" onclick="toggle(this,'Otimizar Touch')">
    <div class="icon">☝️</div>
    <div class="info">
      <div class="name">Otimizar Touch</div>
      <div class="sub">UI Demo</div>
    </div>
    <div class="switch"></div>
  </div>

  <div class="card" onclick="toggle(this,'Retirar Input Lag')">
    <div class="icon">🎮</div>
    <div class="info">
      <div class="name">Retirar Input Lag</div>
      <div class="sub">UI Demo</div>
    </div>
    <div class="switch"></div>
  </div>

  <!-- แก้เฉพาะตรงนี้: เหลือปุ่มเดียว -->
  <div class="buttons">
    <button class="start" onclick="startFF(this)">
      ⚡ Abrir Free Fire
    </button>
  </div>

  <div class="status" id="status">
    STATUS : READY
  </div>

  <div class="footer">
    S H I R T X&nbsp;&nbsp; P A N E L
  </div>

</main>

<script>

/* UI DEMO */
function toggle(card,name){

  card.classList.toggle("on");

  const status=document.getElementById("status");

  if(card.classList.contains("on")){
    status.textContent="✓ ATIVADA "+name;
  }else{
    status.textContent="× DESATIVADA "+name;
  }

  clearTimeout(window.statusTimer);

  window.statusTimer=setTimeout(function(){
    status.textContent="STATUS : READY";
  },3000);
}


/* เปิด Free Fire ปกติ */
function startFF(button){

  button.style.transform="scale(.96)";

  setTimeout(function(){

    button.style.transform="";

    location.href=
      "intent://#Intent;scheme=freefire;package=com.dts.freefireth;end";

  },180);

}


/* ดาว */
const bg=document.getElementById("stars");

for(let i=0;i<100;i++){

  const s=document.createElement("i");

  s.className="star";

  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";

  s.style.animationDuration=
    (6+Math.random()*12)+"s";

  s.style.animationDelay=
    (-Math.random()*15)+"s";

  bg.appendChild(s);
}

</script>

</body>
</html>
