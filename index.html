<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHIRTX PANEL</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

/* ดาวพื้นหลัง */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(2px 2px at 10% 20%,#fff,transparent),
    radial-gradient(2px 2px at 30% 70%,#fff,transparent),
    radial-gradient(1px 1px at 50% 40%,#fff,transparent),
    radial-gradient(2px 2px at 70% 15%,#fff,transparent),
    radial-gradient(1px 1px at 90% 80%,#fff,transparent),
    radial-gradient(2px 2px at 80% 55%,#fff,transparent),
    radial-gradient(1px 1px at 20% 90%,#fff,transparent);
  background-size:300px 300px;
  animation:stars 12s linear infinite;
  opacity:.7;
  z-index:-1;
}

@keyframes stars{
  from{
    transform:translateY(0);
  }
  to{
    transform:translateY(-300px);
  }
}

.container{
  width:92%;
  max-width:650px;
  margin:25px auto;
  padding:25px;
  background:#101010;
  border:1px solid #333;
  border-radius:30px;
  box-shadow:0 0 30px rgba(255,255,255,.08);
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* PROFILE */
.profile{
  width:210px;
  height:210px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 20px;
  border:4px solid #777;
  box-shadow:0 0 25px rgba(255,255,255,.15);
}

.profile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.title{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  letter-spacing:4px;
  margin-bottom:25px;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.menu button,
.game-btn{
  border:1px solid #444;
  background:#191919;
  color:white;
  border-radius:18px;
  padding:20px 10px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.menu button:active,
.game-btn:active{
  transform:scale(.95);
}

.function-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.function-card{
  background:#181818;
  border:1px solid #3b3b3b;
  border-radius:22px;
  padding:20px 15px;
  text-align:center;
  transition:.2s;
}

.function-card:active{
  transform:scale(.97);
}

.icon{
  font-size:40px;
  margin-bottom:10px;
}

.function-name{
  font-size:17px;
  font-weight:bold;
  margin-bottom:8px;
}

.sub{
  color:#888;
  font-size:13px;
  margin-bottom:15px;
}

.toggle{
  width:58px;
  height:30px;
  margin:auto;
  border-radius:30px;
  background:#333;
  position:relative;
  cursor:pointer;
  transition:.25s;
}

.toggle::after{
  content:"";
  width:24px;
  height:24px;
  border-radius:50%;
  background:#aaa;
  position:absolute;
  top:3px;
  left:4px;
  transition:.25s;
}

.toggle.on{
  background:#fff;
}

.toggle.on::after{
  left:30px;
  background:#111;
}

.back{
  width:100%;
  margin-top:20px;
  border:1px solid #444;
  background:#151515;
  color:white;
  border-radius:18px;
  padding:17px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.game-panel{
  display:flex;
  flex-direction:column;
  gap:18px;
  padding-top:20px;
}

.game-btn{
  width:100%;
  min-height:80px;
}

@media(max-width:500px){
  .container{
    width:94%;
    padding:20px;
  }

  .profile{
    width:180px;
    height:180px;
  }

  .function-list{
    grid-template-columns:1fr;
  }

  .title{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- หน้าหลัก -->
  <section id="home" class="page active">

    <!-- โปรไฟล์ที่ใส่ให้ -->
    <div class="profile">
      <img
        src="./Messenger_creation_EE58EC70-CFDC-4C22-8D57-3C3D B93E80B7.jpeg"
        alt="SHIRTX"
      >
    </div>

    <div class="title">SHIRTX</div>

    <div class="menu">
      <button onclick="showPage('functions')">
        FUNCTION
      </button>

      <button onclick="showPage('games')">
        CHOOSE
      </button>
    </div>

  </section>


  <!-- หน้า FUNCTION -->
  <section id="functions" class="page">

    <div class="title">FUNCTION</div>

    <div class="function-list">

      <div class="function-card">
        <div class="icon">🎯</div>
        <div class="function-name">Reduzir Recuo</div>
        <div class="sub">UI Demo</div>
        <div class="toggle" onclick="toggleFunction(this)"></div>
      </div>

      <div class="function-card">
        <div class="icon">⚡</div>
        <div class="function-name">Aumentar FPS</div>
        <div class="sub">UI Demo</div>
        <div class="toggle" onclick="toggleFunction(this)"></div>
      </div>

      <div class="function-card">
        <div class="icon">👆</div>
        <div class="function-name">Otimizar Touch</div>
        <div class="sub">UI Demo</div>
        <div class="toggle" onclick="toggleFunction(this)"></div>
      </div>

      <div class="function-card">
        <div class="icon">🚀</div>
        <div class="function-name">Retirar Input Lag</div>
        <div class="sub">UI Demo</div>
        <div class="toggle" onclick="toggleFunction(this)"></div>
      </div>

    </div>

    <button class="back" onclick="showPage('home')">
      VOLTAR
    </button>

  </section>


  <!-- หน้า CHOOSE -->
  <section id="games" class="page">

    <div class="game-panel">

      <button class="game-btn" onclick="openGame('ff')">
        ABRIR FREE FIRE
      </button>

      <button class="game-btn" onclick="openGame('max')">
        ABRIR FREE FIRE MAX
      </button>

    </div>

    <button class="back" onclick="showPage('home')">
      VOLTAR
    </button>

  </section>

</div>


<script>

function showPage(page){

  document.querySelectorAll('.page').forEach(function(p){
    p.classList.remove('active');
  });

  document.getElementById(page).classList.add('active');

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}


function toggleFunction(btn){

  btn.classList.toggle('on');

}


function openGame(type){

  const pkg = type === 'max'
    ? 'com.dts.freefiremax'
    : 'com.dts.freefireth';

  const intent =
    'intent://#Intent;' +
    'scheme=freefire;' +
    'package=' + pkg +
    ';end';

  const store =
    'https://play.google.com/store/apps/details?id=' + pkg;

  window.location.href = intent;

  setTimeout(function(){

    window.location.href = store;

  },1500);

}

</script>

</body>
</html>
