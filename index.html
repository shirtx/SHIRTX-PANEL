<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">

<title>SHIRTX</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:#000;
  background-image:
    radial-gradient(1px 1px at 8% 15%,#aaa 0,transparent 2px),
    radial-gradient(1px 1px at 20% 38%,#aaa 0,transparent 2px),
    radial-gradient(1px 1px at 31% 12%,#aaa 0,transparent 2px),
    radial-gradient(1px 1px at 44% 48%,#aaa 0,transparent 2px),
    radial-gradient(1px 1px at 58% 20%,#aaa 0,transparent 2px),
    radial-gradient(1px 1px at 72% 42%,#aaa 0,transparent 2px),
    radial-gradient(1px 1px at 86% 18%,#aaa 0,transparent 2px),
    radial-gradient(1px 1px at 94% 58%,#aaa 0,transparent 2px),
    radial-gradient(1px 1px at 15% 78%,#aaa 0,transparent 2px),
    radial-gradient(1px 1px at 50% 84%,#aaa 0,transparent 2px);
}

.container{
  width:min(94vw,760px);
  margin:0 auto;
  padding:38px 0 70px;
}

.header{
  text-align:center;
}

.profile{
  width:210px;
  height:210px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 20px;
  filter:drop-shadow(0 0 16px #777);
}

.logo{
  font-size:clamp(48px,10vw,72px);
  font-weight:800;
  letter-spacing:-2px;
  margin-bottom:34px;
}

.nav{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-bottom:38px;
}

.nav button,
.game-btn{
  border:1.5px solid #aaa;
  background:linear-gradient(145deg,#202020,#151515);
  color:#fff;
  border-radius:28px;
  min-height:116px;
  font-size:clamp(24px,5vw,34px);
  font-weight:800;
  cursor:pointer;
  box-shadow:inset 0 0 20px rgba(255,255,255,.025);
  transition:.15s;
}

.nav button:active,
.game-btn:active,
.toggle:active{
  transform:scale(.97);
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.cards{
  display:flex;
  flex-direction:column;
  gap:28px;
}

.card{
  min-height:198px;
  border:1px solid #555;
  border-radius:34px;
  background:linear-gradient(145deg,#1d1d1d,#171717);
  display:flex;
  align-items:center;
  padding:28px 32px;
  gap:28px;
}

.icon{
  width:112px;
  height:112px;
  border-radius:24px;
  background:#000;
  display:grid;
  place-items:center;
  font-size:62px;
  flex:none;
}

.info{
  min-width:0;
  flex:1;
}

.title{
  font-size:clamp(26px,5vw,38px);
  font-weight:800;
  white-space:nowrap;
}

.sub{
  font-size:22px;
  color:#aaa;
  margin-top:10px;
}

.toggle{
  width:108px;
  height:62px;
  border:0;
  border-radius:40px;
  background:#666;
  position:relative;
  flex:none;
  cursor:pointer;
  transition:.2s;
}

.toggle span{
  position:absolute;
  width:52px;
  height:52px;
  left:5px;
  top:5px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.toggle.on{
  background:#888;
}

.toggle.on span{
  transform:translateX(46px);
}

.game-panel{
  background:linear-gradient(145deg,#242424,#1b1b1b);
  border:1px solid #555;
  border-radius:38px;
  padding:42px 40px;
  display:flex;
  flex-direction:column;
  gap:28px;
  max-width:760px;
  margin:0 auto;
}

.game-btn{
  min-height:104px;
  font-size:clamp(21px,4.5vw,30px);
  border-radius:30px;
}

.install{
  display:none;
  margin:28px auto 0;
  border:1px solid #666;
  background:#1c1c1c;
  color:#fff;
  border-radius:20px;
  padding:15px 24px;
  font-size:18px;
  font-weight:700;
}

@media(max-width:600px){

  .container{
    width:92vw;
    padding-top:26px;
  }

  .profile{
    width:180px;
    height:180px;
  }

  .logo{
    font-size:54px;
    margin-bottom:28px;
  }

  .nav{
    gap:16px;
    margin-bottom:28px;
  }

  .nav button{
    min-height:96px;
    border-radius:25px;
    font-size:25px;
  }

  .card{
    min-height:170px;
    padding:22px 20px;
    gap:20px;
    border-radius:30px;
  }

  .icon{
    width:96px;
    height:96px;
    font-size:52px;
    border-radius:22px;
  }

  .title{
    font-size:28px;
  }

  .sub{
    font-size:19px;
  }

  .toggle{
    width:96px;
    height:56px;
  }

  .toggle span{
    width:48px;
    height:48px;
  }

  .toggle.on span{
    transform:translateX(40px);
  }

  .game-panel{
    padding:34px 28px;
    border-radius:34px;
  }
}
</style>
</head>

<body>

<div class="container">

<header class="header"><div class="avatar">
  <img src="./Messenger_creation_EE58EC70-CFDC-4C22-8D57-3C3D B93E80B7.jpeg" alt="Profile">
</div>

  <img
  class="profile"
  src="./Messenger_creation_EE58EC70-CFDC-4C22-8D57-3C3D B93E80B7.jpeg"
  alt="SHIRTX"
>

  <div class="logo">SHIRTX</div>

</header>


<!-- ปุ่มหลัก -->
<div class="nav">

  <button onclick="showPage('functions')">
    Function
  </button>

  <button onclick="showPage('games')">
    Choose
  </button>

</div>


<!-- =========================
     หน้า FUNCTION
========================= -->

<section id="functions" class="page active">

  <div class="cards">

    <div class="card">

      <div class="icon">🎯</div>

      <div class="info">
        <div class="title">
          Reduzir Recuo
        </div>

        <div class="sub">
          UI Demo
        </div>
      </div>

      <button
        class="toggle"
        onclick="toggleFunction(this)"
      >
        <span></span>
      </button>

    </div>


    <div class="card">

      <div class="icon">⚡</div>

      <div class="info">
        <div class="title">
          Aumentar FPS
        </div>

        <div class="sub">
          UI Demo
        </div>
      </div>

      <button
        class="toggle"
        onclick="toggleFunction(this)"
      >
        <span></span>
      </button>

    </div>


    <div class="card">

      <div class="icon">☝️</div>

      <div class="info">
        <div class="title">
          Otimizar Touch
        </div>

        <div class="sub">
          UI Demo
        </div>
      </div>

      <button
        class="toggle"
        onclick="toggleFunction(this)"
      >
        <span></span>
      </button>

    </div>


    <div class="card">

      <div class="icon">🎮</div>

      <div class="info">
        <div class="title">
          Retirar Input Lag
        </div>

        <div class="sub">
          UI Demo
        </div>
      </div>

      <button
        class="toggle"
        onclick="toggleFunction(this)"
      >
        <span></span>
      </button>

    </div>

  </div>

</section>


<!-- =========================
     หน้า CHOOSE
     ไม่มีคำว่า "เลือกเกม"
========================= -->

<section id="games" class="page">

  <div class="game-panel">

    <button
      class="game-btn"
      onclick="openGame('ff')"
    >
      ABRIR FREE FIRE
    </button>


    <button
      class="game-btn"
      onclick="openGame('max')"
    >
      ABRIR FREE FIRE MAX
    </button>

  </div>

</section>


<!-- ปุ่มติดตั้ง PWA -->
<button
  id="installBtn"
  class="install"
  onclick="installApp()"
>
  ติดตั้ง SHIRTX
</button>

</div>


<script>

let deferredPrompt = null;


/* =========================
   เปลี่ยนหน้า
========================= */

function showPage(page){

  document
    .querySelectorAll('.page')
    .forEach(function(p){
      p.classList.remove('active');
    });

  document
    .getElementById(page)
    .classList.add('active');

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =========================
   เปิด / ปิด Function
   ไม่มีข้อความ ON เด้งอีก
========================= */

function toggleFunction(btn){

  btn.classList.toggle('on');

}


/* =========================
   เปิด Free Fire
========================= */

function openGame(type){

  const pkg =
    type === 'max'
    ? 'com.dts.freefiremax'
    : 'com.dts.freefireth';

  const intent =
    'intent://#Intent;' +
    'scheme=freefire;' +
    'package=' + pkg +
    ';end';

  const store =
    'https://play.google.com/store/apps/details?id='
    + pkg;

  window.location.href = intent;

  setTimeout(function(){

    window.location.href = store;

  },1500);

}


/* =========================
   PWA ติดตั้งแอป
========================= */

window.addEventListener(
  'beforeinstallprompt',
  function(e){

    e.preventDefault();

    deferredPrompt = e;

    document
      .getElementById('installBtn')
      .style.display = 'block';

  }
);


async function installApp(){

  if(!deferredPrompt){
    return;
  }

  deferredPrompt.prompt();

  await deferredPrompt.userChoice;

  deferredPrompt = null;

  document
    .getElementById('installBtn')
    .style.display = 'none';

}


/* =========================
   Service Worker
========================= */

if('serviceWorker' in navigator){

  window.addEventListener(
    'load',
    function(){

      navigator.serviceWorker
        .register('sw.js')
        .catch(function(){});

    }
  );

}

</script>

</body>
</html>
